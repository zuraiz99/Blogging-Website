name: PR Validation

on:
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v3

      # Step 2: Setup Node.js (required for npm packages)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16' # You can use a higher version if you need.

      # Step 3: Install dependencies (HTMLHint, Stylelint, etc.)
      - name: Install dependencies
        run: |
          npm install htmlhint stylelint stylelint-config-standard

      # Step 4: Lint HTML files
      - name: Lint HTML
        run: |
          npx htmlhint "src/**/*.html"

      # Step 5: Lint CSS files
      - name: Lint CSS
        run: |
          npx stylelint "styles/**/*.css"

  build:
    runs-on: ubuntu-latest
    needs: lint # Ensures lint job must pass before this one

    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v3

      # Step 2: Setup Node.js (required for Parcel)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'

      # Step 3: Install dependencies (Parcel)
      - name: Install dependencies
        run: |
          npm install parcel

      # Step 4: Build the static website using Parcel
      - name: Build project
        run: |
          npx parcel build src/index.html --dist-dir build
