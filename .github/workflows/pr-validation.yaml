name: PR Validation

on:
  pull_request:
    branches:
      - develop
      - main

jobs:
  lint:
    runs-on: ubuntu-latest  # Specifies the Ubuntu runner
    
    steps:
      # Step 1: Checkout the code
      - uses: actions/checkout@v3

      # Step 2: Setup Node.js (required for npm packages)
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '16'  # You can change this to a higher version if needed.

      # Step 3: Install dependencies (HTMLHint, Stylelint, etc.)
      - name: Install dependencies
        run: |
          npm install htmlhint stylelint stylelint-config-standard

      # Step 4: Lint HTML files
      - name: Lint HTML
        run: |
          npx htmlhint "src/**/*.html"  # Adjust the path based on your project structure

      # Step 5: Lint CSS files
      - name: Lint CSS
        run: |
          npx stylelint "styles/**/*.css"  # Adjust the path based on your project structure

